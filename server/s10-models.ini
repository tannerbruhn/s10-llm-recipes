; s10-models.ini: router presets for the S10 (our llama.cpp fork, branch mali-port).
; One model in RAM at a time (--models-max 1); the request's "model" field picks it.
version = 1

[*]
jinja = true
reasoning-budget = 1000
cache-ram = 0
ctx-checkpoints = 4
np = 1
metrics = true
cpu-strict = 1

; Ornith 1.0 9B, our own IQ4_NL mix "M5" (quant/STEPS.md): pp64 7.86, tg64 3.33, wikitext PPL 9.23.
; 2 fast M4 cores (cpus 6-7), the same cores ik used.
[ornith-1.0-9b]
model = /home/user/models/Ornith-1.0-9B-S10-m5.gguf
t = 2
C = 0xc0
c = 16384
load-on-startup = true

; Ternary Bonsai 2 27B (PTQ1_0) with the Mali GPU assist (gpu/ASSIST.md): tg ~1.2, pp128 ~2.0.
; 4 cores (2 M4 + 2 A75, cpus 4-7); the assist's OpenCL driver threads stay on cpus 0-3.
[bonsai-27b]
model = /home/user/models/Ternary-Bonsai-2-27B-PTQ1_0.gguf
t = 4
C = 0xf0
c = 8192
