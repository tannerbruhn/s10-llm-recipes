; s10-models.ini: router presets for the S10 (llama.cpp-s10, https://github.com/tannerbruhn/llama.cpp-s10).
; One model in RAM at a time (--models-max 1); the request's "model" field picks it.
version = 1

[*]
jinja = true
reasoning-budget = 1000
cache-ram = 0
ctx-checkpoints = 4
np = 1
metrics = true
cpu-strict = 1

; Ornith 1.5 9B, our IQ4_NL mix "M5" with its MTP layer in Q8_0 (quant/STEPS.md). Default model, no speculation:
; 3.33 tok/s generation on every kind of text. 2 M4 cores (cpus 6-7).
[ornith-1.5-9b]
model = /home/user/models/Ornith-1.5-9B-S10-m5.gguf
t = 2
C = 0xc0
c = 16384
load-on-startup = true

; Same model with MTP speculation (its own extra layer guesses ~3 tokens, checked as one 4-token batch).
; For coding agents and edit jobs: code 3.94 (+18%), copy/edit 4.48 (+35%); prose 2.9-3.3 (-2..-13%).
[ornith-1.5-9b-mtp]
model = /home/user/models/Ornith-1.5-9B-S10-m5.gguf
spec-type = draft-mtp
t = 2
C = 0xc0
c = 16384

; Ornith 1.0 9B, our IQ4_NL mix "M5" (previous default): pp64 7.86, tg64 3.33, wikitext PPL 9.23.
[ornith-1.0-9b]
model = /home/user/models/Ornith-1.0-9B-S10-m5.gguf
t = 2
C = 0xc0
c = 16384

; Ternary Bonsai 2 27B (PTQ1_0) with the Mali GPU assist (gpu/ASSIST.md): tg ~1.2, pp128 ~2.0.
; 4 cores (2 M4 + 2 A75, cpus 4-7); the assist's OpenCL driver threads stay on cpus 0-3.
[bonsai-27b]
model = /home/user/models/Ternary-Bonsai-2-27B-PTQ1_0.gguf
t = 4
C = 0xf0
c = 8192
