; s10-models.ini: router presets for the S10 (llama.cpp-s10, https://github.com/tannerbruhn/llama.cpp-s10).
; One model in RAM at a time (--models-max 1); the request's "model" field picks it.
version = 1

[*]
jinja = true
reasoning-budget = 1000
cache-ram = 0
ctx-checkpoints = 4
np = 1
metrics = true
cpu-strict = 1

; Ornith 1.5 9B, our IQ4_NL mix "M5" with its MTP layer in Q8_0 (quant/STEPS.md). Default model, no speculation:
; 3.33 tok/s generation on every kind of text. 2 M4 cores (cpus 6-7).
[ornith-1.5-9b]
model = /home/user/models/Ornith-1.5-9B-S10-m5.gguf
t = 2
C = 0xc0
c = 16384
load-on-startup = true

; Same model with MTP speculation (its own extra layer guesses ~3 tokens, checked as one 4-token batch).
; For coding agents and edit jobs. 2026-11-19 with rollback by replay (-116 MB vs snapshots): code 4.07 (+23%),
; copy/edit 4.51 (+36%), prose 3.46 (+4%; was 3.26 with snapshots). No MTP: 3.31 on all three.
[ornith-1.5-9b-mtp]
model = /home/user/models/Ornith-1.5-9B-S10-m5.gguf
spec-type = draft-mtp
t = 2
C = 0xc0
c = 16384

; Ornith 1.0 9B, our IQ4_NL mix "M5" (previous default): pp64 7.86, tg64 3.33, wikitext PPL 9.23.
[ornith-1.0-9b]
model = /home/user/models/Ornith-1.0-9B-S10-m5.gguf
t = 2
C = 0xc0
c = 16384

; Ternary Bonsai 2 27B, vocabulary condensed to 142,744 tokens (P2TG), with the Mali GPU assist (gpu/ASSIST.md) and the
; Qwen3.8-27B MTP head grafted on (P2TG-mtp): MTP-1 speculation, rollback by replay (no second copy of the 48 linear-attention
; states, -140 MB), 8-bit KV cache, small weights mlocked (GGML_S10_MLOCK_SMALL in the unit). Default since 2026-11-19.
; 4096 ctx: prompt + answer must stay under ~4000 tokens. Phone test: prose 1.46, code 1.51, edit 1.64 tok/s (no MTP:
; ~1.31/1.33/1.19); 184 MB free at the lowest on the second phone. 4 cores (2 M4 + 2 A75, cpus 4-7).
; MTP head v2 since 2026-11-20 (retrained on Bonsai's own answers): acceptance 77% -> 83%, +3.4% tok/s, same answers.
; First head: ...-P2TG-mtp.gguf (same repo).
[bonsai-27b]
model = /home/user/models/Bonsai2-27B-PTQ1_0-Condensed-P2TG-mtp-v2.gguf
t = 4
C = 0xf0
c = 4096
ctx-checkpoints = 0
spec-type = draft-mtp
spec-draft-n-max = 1
ctk = q8_0
ctv = q8_0
fa = on

; Same 27B without MTP (the default until 2026-11-19): tg ~1.2-1.3, more free memory, f16 KV. Fallback if MTP misbehaves.
[bonsai-27b-plain]
model = /home/user/models/Bonsai2-27B-PTQ1_0-Condensed-P2TG.gguf
t = 4
C = 0xf0
c = 4096
ctx-checkpoints = 0
